{{- /* Root-relative image paths (/images/...) must include the site sub-path on GitHub Pages. */ -}}
{{- $src := .Destination -}}
{{- if hasPrefix $src "/" -}}{{- $src = relURL (strings.TrimPrefix "/" $src) -}}{{- end -}}
<img src="{{ $src | safeURL }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy">
